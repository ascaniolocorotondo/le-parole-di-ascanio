<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Parole di Ascanio</title>
<link rel="stylesheet" href="style.css">
<style>
h1{font-size:1.6rem;text-align:center}
header{justify-content:center}
#setup{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(96vw,420px)}
#setup h2{font-size:1rem;margin:0 0 8px;text-align:center}
.choice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.choice button{min-width:52px}
.choice button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.diff button{display:flex;flex-direction:column;align-items:center;min-width:110px}
.diff small{opacity:.8;font-size:.75rem}
#play{font-size:1.2rem;padding:12px 40px;font-weight:700}
#game{display:none;flex-direction:column;align-items:center;width:100%;max-width:500px}
#info{color:var(--muted);font-size:.9rem;margin:0 0 10px}
#rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;gap:6px;justify-content:center}
.r.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.t{width:min(9.5vw,50px);aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:6px;font-weight:700;font-size:clamp(1rem,5vw,1.4rem);text-transform:uppercase;background:var(--card)}
.ok{background:#3c9a4f!important;border-color:#3c9a4f!important;color:#fff!important}
.in{background:#d4a72c!important;border-color:#d4a72c!important;color:#fff!important}
.no{background:#7a7a80!important;border-color:#7a7a80!important;color:#fff!important}
#kb{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:100%}
#kb div{display:flex;gap:4px;justify-content:center}
.k{flex:1;padding:14px 0;text-transform:uppercase;font-weight:600;min-width:0}
.k.wide{flex:1.6;font-size:.75rem}
footer{margin-top:auto;padding-top:24px;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Le Parole di Ascanio</h1></header>

<section id="setup">
  <p class="help">Indovina la parola segreta. Dopo ogni tentativo le lettere si colorano: 🟩 giusta al posto giusto, 🟨 c'è ma in un altro posto, ⬜ non c'è. Valgono solo parole italiane vere.</p>
  <div><h2>Quante lettere?</h2><div class="choice" id="lens"></div></div>
  <div><h2>Difficoltà</h2><div class="choice diff" id="diffs"></div></div>
  <button id="play" disabled>Carico il dizionario…</button>
</section>

<section id="game">
  <p id="info"></p>
  <div id="rows"></div>
  <p class="status" id="st" aria-live="polite"></p>
  <div id="kb"></div>
  <p class="row"><button id="again">Nuova partita</button></p>
</section>

<footer>Dizionario: <a href="https://github.com/napolux/paroleitaliane">paroleitaliane</a> (MIT)</footer>

<script>
const $=id=>document.getElementById(id),RANK={no:1,in:2,ok:3};
const DIFF={facile:{name:'Facile',desc:'prima lettera data, +2 tentativi',hint:true,extra:2},
            media:{name:'Media',desc:'+1 tentativo',hint:false,extra:1},
            difficile:{name:'Difficile',desc:'tentativi = lettere',hint:false,extra:0}};
let SECRETS=[],VALID=new Set(),len=5,diff='media';
let secret,tries,guesses,typed,over,keyState,fixed;

function score(g,s){
  const res=Array(s.length).fill('no'),left={};
  for(let i=0;i<s.length;i++)if(g[i]===s[i])res[i]='ok';else left[s[i]]=(left[s[i]]||0)+1;
  for(let i=0;i<s.length;i++)if(res[i]!=='ok'&&left[g[i]]>0){res[i]='in';left[g[i]]--}
  return res}
console.assert(score('palla','pasta')+''==='ok,ok,no,no,ok'&&score('carta','tarca')+''==='in,ok,ok,in,ok','parole: self-check fallito');

// scelte
function choice(box,items,get,set){
  box.replaceChildren(...items.map(([v,html])=>{const b=document.createElement('button');b.innerHTML=html;
    b.setAttribute('aria-pressed',v===get());b.onclick=()=>{set(v);[...box.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};return b}))}
choice($('lens'),[4,5,6,7,8].map(n=>[n,n]),()=>len,v=>len=v);
choice($('diffs'),Object.entries(DIFF).map(([k,d])=>[k,`${d.name}<small>${d.desc}</small>`]),()=>diff,v=>diff=v);

fetch('parole.json').then(r=>r.json()).then(d=>{
  SECRETS=d.segrete;VALID=new Set(d.valide.split(' '));$('play').disabled=false;$('play').textContent='Gioca'})
.catch(()=>{$('play').textContent='Errore nel caricare il dizionario: ricarica la pagina'});

// tastiera
const keys={};
['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'].forEach(row=>{
  const d=document.createElement('div');
  for(const ch of row){const b=document.createElement('button');
    b.textContent=ch==='⏎'?'invio':ch;b.setAttribute('aria-label',ch==='⏎'?'invio':ch==='⌫'?'cancella':ch);
    b.onclick=()=>key(ch);keys[ch]=b;d.append(b)}
  $('kb').append(d)});

function rowEl(word,res){
  const r=document.createElement('div');r.className='r';
  [...word.padEnd(len,' ')].forEach((c,i)=>{const t=document.createElement('span');t.className='t '+(res?res[i]:'');t.textContent=c;r.append(t)});
  return r}
function draw(){
  const rows=guesses.map(([w,res])=>rowEl(w,res));
  if(!over)rows.push(rowEl(typed));
  while(rows.length<tries)rows.push(rowEl(''));
  $('rows').replaceChildren(...rows);
  for(const ch in keys)keys[ch].className='k'+(ch==='⏎'||ch==='⌫'?' wide':'')+(keyState[ch]?' '+keyState[ch]:'')}
function say(msg,shake){
  $('st').textContent=msg;
  if(shake){const r=$('rows').children[guesses.length];r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake')}}
function key(ch){
  if(over)return;
  if(ch==='⌫'){if(typed.length>fixed)typed=typed.slice(0,-1)}
  else if(ch==='⏎'){
    if(typed.length<len)return say(`Servono ${len} lettere`,true);
    if(!VALID.has(typed))return say(`"${typed.toUpperCase()}" non è nel dizionario`,true);
    const res=score(typed,secret);guesses.push([typed,res]);
    [...typed].forEach((c,i)=>{if(!keyState[c]||RANK[res[i]]>RANK[keyState[c]])keyState[c]=res[i]});
    if(typed===secret){over=true;say(`Trovata in ${guesses.length} ${guesses.length===1?'tentativo':'tentativi'}! 🎉`)}
    else if(guesses.length===tries){over=true;say(`La parola era "${secret.toUpperCase()}"`)}
    else say(`Tentativi rimasti: ${tries-guesses.length}`);
    typed=secret.slice(0,fixed)}
  else if(typed.length<len){typed+=ch;$('st').textContent=''}
  draw()}
document.addEventListener('keydown',e=>{
  if($('game').style.display!=='flex'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();key('⏎')}
  else if(e.key==='Backspace')key('⌫');
  else if(/^[a-z]$/i.test(e.key))key(e.key.toLowerCase())});

function start(){
  const d=DIFF[diff],pool=SECRETS.filter(w=>w.length===len);
  secret=pool[Math.random()*pool.length|0];tries=len+d.extra;fixed=d.hint?1:0;
  guesses=[];typed=secret.slice(0,fixed);over=false;keyState={};
  $('info').textContent=`${len} lettere · ${d.name} · ${tries} tentativi`;say('');
  $('setup').style.display='none';$('game').style.display='flex';draw()}
$('play').onclick=start;
$('again').onclick=()=>{$('game').style.display='none';$('setup').style.display='flex'};
</script>
</body>
</html>
