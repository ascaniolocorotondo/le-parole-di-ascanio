<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parola segreta · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>
#rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;gap:6px;align-items:center}
.t{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);border-radius:6px;font-weight:700;text-transform:uppercase;background:var(--card);cursor:pointer;user-select:none}
.t.no,.k.no{opacity:.3;text-decoration:line-through}
.r .s{min-width:80px;font-weight:600;padding-left:6px}
#kb{display:flex;flex-direction:column;gap:6px;margin-top:12px;width:min(96vw,480px)}
#kb div{display:flex;gap:4px;justify-content:center}
.k{flex:1;padding:12px 0;text-transform:uppercase;font-weight:600;min-width:0}
.k.wide{flex:1.6;font-size:.8rem}
</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Parola segreta</h1><span></span></header>
<p class="help">Indovina la parola di 5 lettere in 10 tentativi. Dopo ogni prova vedi 🎯 quante lettere sono al posto giusto e 🔁 quante ci sono ma in un altro posto. Tocca una lettera già usata per barrarla.</p>
<div id="rows"></div>
<p class="status" id="st"></p>
<div id="kb"></div>
<p><button id="new">Nuova parola</button></p>
<script>
const W=`amico banca barca bocca borsa bosco calma campo carta cielo cuore dente donna fiore fuoco gatto gioco grano latte libro luogo mondo monte notte nuovo pasta penna piano piede pollo porta prato punto rosso sasso scala segno sedia sogno spada stato tempo terra testa torre treno vento verde vetro vespa zebra zucca acqua aereo amore birra canto capra cervo colpo corda corpo costa cuoco festa fiume forno frase fungo gesto gioia gonna lampo lente letto madre mappa mente miele nonna nonno padre palla parco parte pesce piuma pizza ponte radio regno ruota salsa scopa serra sfida sorte spina sport tasto tazza tenda tigre tondo torta valle vasca verso viola vista volpe zaino`.split(' ');
const $=id=>document.getElementById(id),TRIES=10;
function score(g,s){
  let ex=0,common=0;const cnt={};
  for(let i=0;i<5;i++){if(g[i]===s[i])ex++;cnt[s[i]]=(cnt[s[i]]||0)+1}
  for(const ch of g)if(cnt[ch]>0){cnt[ch]--;common++}
  return[ex,common-ex]}
console.assert(score('palla','pasta')+''==='3,0'&&score('carta','tarca')+''==='3,2'&&W.every(w=>w.length===5),'parola: self-check fallito');
let secret,guesses,typed,over;const crossed=new Set();
const keys={};
['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'].forEach(row=>{
  const d=document.createElement('div');
  for(const ch of row){const b=document.createElement('button');b.className='k'+(ch==='⏎'||ch==='⌫'?' wide':'');
    b.textContent=ch==='⏎'?'invio':ch;b.setAttribute('aria-label',ch==='⏎'?'invio':ch==='⌫'?'cancella':ch);
    b.onclick=()=>key(ch);keys[ch]=b;d.append(b)}
  $('kb').append(d)});
function tile(ch){const t=document.createElement('span');t.className='t'+(crossed.has(ch)?' no':'');t.textContent=ch;
  if(ch.trim())t.onclick=()=>{crossed.has(ch)?crossed.delete(ch):crossed.add(ch);draw()};return t}
function draw(){
  $('rows').replaceChildren(...guesses.map(([w,[e,p]])=>{const r=document.createElement('div');r.className='r';
    [...w].forEach(c=>r.append(tile(c)));const s=document.createElement('span');s.className='s';s.textContent=`🎯${e} 🔁${p}`;r.append(s);return r}));
  if(!over){const r=document.createElement('div');r.className='r';[...typed.padEnd(5,' ')].forEach(c=>r.append(tile(c)));$('rows').append(r)}
  for(const ch in keys)keys[ch].classList.toggle('no',crossed.has(ch))}
function key(ch){
  if(over)return;
  if(ch==='⌫')typed=typed.slice(0,-1);
  else if(ch==='⏎'){
    if(typed.length<5)return void($('st').textContent='Servono 5 lettere');
    const sc=score(typed,secret);guesses.push([typed,sc]);typed='';
    if(sc[0]===5){over=true;$('st').textContent=`Trovata in ${guesses.length} tentativi! 🎉`}
    else if(guesses.length===TRIES){over=true;$('st').textContent=`Era "${secret.toUpperCase()}"`}
    else $('st').textContent=`Tentativi rimasti: ${TRIES-guesses.length}`}
  else if(typed.length<5)typed+=ch;
  draw()}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter')key('⏎');else if(e.key==='Backspace')key('⌫');else if(/^[a-z]$/i.test(e.key))key(e.key.toLowerCase())});
function newGame(){secret=W[Math.random()*W.length|0];guesses=[];typed='';over=false;crossed.clear();$('st').textContent=`Tentativi: ${TRIES}`;draw()}
$('new').onclick=newGame;newGame();
</script>
</body>
</html>
