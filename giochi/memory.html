<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>
#g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,400px)}
#g button{aspect-ratio:1;font-size:2.4rem;padding:0;background:var(--accent)}
#g button.open{background:var(--card)}
</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Memory</h1><span></span></header>
<div class="bar"><span>Mosse: <b id="mv">0</b></span><span>Record: <b id="best">–</b></span></div>
<p class="status" id="st"></p>
<div id="g"></div>
<p><button id="new">Nuova partita</button></p>
<script>
const $=id=>document.getElementById(id),E=['🍕','🐱','🚀','🌈','⚽','🎸','🍦','🦊'];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let first,lock,moves,found,best=0;
try{best=+localStorage.getItem('memory')||0}catch{}
function flip(b){
  if(lock||b===first||b.classList.contains('open'))return;
  b.classList.add('open');b.textContent=b.dataset.e;
  if(!first){first=b;return}
  $('mv').textContent=++moves;
  if(first.dataset.e===b.dataset.e){
    first=null;
    if(++found===E.length){
      $('st').textContent=`Vinto in ${moves} mosse! 🎉`;
      if(!best||moves<best){best=moves;try{localStorage.setItem('memory',best)}catch{}$('best').textContent=best}}}
  else{lock=true;const a=first;first=null;
    setTimeout(()=>{[a,b].forEach(c=>{c.classList.remove('open');c.textContent=''});lock=false},700)}}
function newGame(){
  first=null;lock=false;moves=0;found=0;$('mv').textContent=0;$('st').textContent='';$('best').textContent=best||'–';
  $('g').replaceChildren(...shuffle([...E,...E]).map((e,i)=>{
    const b=document.createElement('button');b.dataset.e=e;b.setAttribute('aria-label','carta '+(i+1));b.onclick=()=>flip(b);return b}))}
$('new').onclick=newGame;newGame();
</script>
</body>
</html>
