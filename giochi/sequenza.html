<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sequenza · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>
#pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(86vw,340px)}
#pad button{aspect-ratio:1;border:none;opacity:.45;transition:opacity .1s}
#pad button.lit{opacity:1;transform:scale(1.04)}
</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Sequenza</h1><span></span></header>
<div class="bar"><span>Livello: <b id="lvl">0</b></span><span>Record: <b id="best">0</b></span></div>
<p class="status" id="st">Premi Inizia</p>
<div id="pad"></div>
<p><button id="go">Inizia</button></p>
<script>
const $=id=>document.getElementById(id),COL=['#2a9d8f','#e63946','#ffd166','#3a86ff'],NOTE=[330,262,392,494];
let seq=[],pos=0,listening=false,best=0,audio;
try{best=+localStorage.getItem('sequenza')||0}catch{}
$('best').textContent=best;
const pads=COL.map((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',['verde','rosso','giallo','blu'][i]);b.onclick=()=>press(i);$('pad').append(b);return b});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function beep(i){
  try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=NOTE[i];g.gain.value=.1;
    o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.25)}catch{}}
async function flash(i,ms=400){pads[i].classList.add('lit');beep(i);await wait(ms);pads[i].classList.remove('lit')}
async function play(){
  listening=false;$('st').textContent='Guarda...';await wait(600);
  for(const i of seq){await flash(i,Math.max(200,450-seq.length*15));await wait(150)}
  pos=0;listening=true;$('st').textContent='Tocca a te!'}
function next(){seq.push(Math.random()*4|0);$('lvl').textContent=seq.length;play()}
function press(i){
  if(!listening)return;flash(i,200);
  if(i!==seq[pos]){
    listening=false;const lv=seq.length-1;
    if(lv>best){best=lv;try{localStorage.setItem('sequenza',best)}catch{}$('best').textContent=best}
    $('st').textContent=`Sbagliato! Sei arrivato al livello ${lv}`;$('go').disabled=false;return}
  if(++pos===seq.length){listening=false;next()}}
$('go').onclick=()=>{seq=[];$('go').disabled=true;next()};
</script>
</body>
</html>
