<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acchiappa la talpa · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>
#holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(90vw,360px)}
.h{aspect-ratio:1;border-radius:50%;background:#5b3a1e;border:none;font-size:3rem;padding:0;user-select:none}
.h.up::after{content:'🐹'}
.h.hit::after{content:'💥'}
</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Acchiappa la talpa</h1><span></span></header>
<div class="bar"><span>Punti: <b id="pts">0</b></span><span>Tempo: <b id="time">30</b></span><span>Record: <b id="best">0</b></span></div>
<p class="status" id="st">Premi Inizia!</p>
<div id="holes"></div>
<p><button id="go">Inizia</button></p>
<script>
const $=id=>document.getElementById(id);
let pts=0,left,running=false,timer,popT,best=0;
try{best=+localStorage.getItem('talpa')||0}catch{}
$('best').textContent=best;
const holes=[...Array(9)].map((_,i)=>{
  const b=document.createElement('button');b.className='h';b.setAttribute('aria-label','buca '+(i+1));
  b.onpointerdown=b.onclick=()=>whack(b);$('holes').append(b);return b});
function whack(b){
  if(!running||!b.classList.contains('up'))return;
  b.classList.replace('up','hit');$('pts').textContent=++pts;setTimeout(()=>b.classList.remove('hit'),200)}
function pop(){
  holes.forEach(h=>h.classList.remove('up'));
  const free=holes.filter(h=>!h.classList.contains('hit'));
  free[Math.random()*free.length|0].classList.add('up');
  popT=setTimeout(pop,Math.max(450,900-pts*15))}
function start(){
  pts=0;left=30;running=true;$('pts').textContent=0;$('time').textContent=30;$('st').textContent='Vai!';$('go').disabled=true;pop();
  timer=setInterval(()=>{$('time').textContent=--left;if(!left)end()},1000)}
function end(){
  running=false;clearInterval(timer);clearTimeout(popT);holes.forEach(h=>h.classList.remove('up'));$('go').disabled=false;
  if(pts>best){best=pts;try{localStorage.setItem('talpa',best)}catch{}$('best').textContent=best;$('st').textContent=`Nuovo record: ${pts}!`}
  else $('st').textContent=`Fine! ${pts} punti`}
$('go').onclick=start;
</script>
</body>
</html>
