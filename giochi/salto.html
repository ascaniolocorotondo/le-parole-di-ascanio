<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salto · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>header{max-width:600px}</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Salto</h1><span></span></header>
<div class="bar"><span>Punti: <b id="pts">0</b></span><span>Record: <b id="best">0</b></span></div>
<p class="status" id="st">Tocca o premi spazio per saltare</p>
<canvas id="c" width="600" height="220" style="width:min(94vw,600px)"></canvas>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),W=600,H=220,G=H-30;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v);
let y,vy,obs,speed,dist,running=false,dead=false,spawn,best=0;
try{best=+localStorage.getItem('salto')||0}catch{}
$('best').textContent=best;
function reset(){y=G;vy=0;obs=[];speed=5;dist=0;spawn=60;dead=false}
function jump(){
  if(!running){reset();running=true;$('st').textContent='';return}
  if(y>=G)vy=-11}
function tick(){
  if(running){
    vy+=.6;y=Math.min(G,y+vy);if(y===G)vy=0;
    dist+=speed;speed+=.002;
    if(--spawn<=0){const h=20+Math.random()*30;obs.push({x:W,w:14+Math.random()*16,h});spawn=50+Math.random()*60}
    obs.forEach(o=>o.x-=speed);obs=obs.filter(o=>o.x+o.w>0);
    // giocatore: quadrato 30x30 a x=60
    if(obs.some(o=>o.x<84&&o.x+o.w>66&&y>G-o.h+4)){
      running=false;const s=dist/50|0;
      if(s>best){best=s;try{localStorage.setItem('salto',best)}catch{}$('best').textContent=best}
      $('st').textContent=`Ahi! ${s} punti. Tocca per riprovare`}
    $('pts').textContent=dist/50|0}
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=css('--line');ctx.fillRect(0,G,W,2);
  ctx.fillStyle=css('--accent');ctx.fillRect(60,y-30,30,30);
  ctx.fillStyle=css('--ok');obs.forEach(o=>ctx.fillRect(o.x,G-o.h,o.w,o.h));
  requestAnimationFrame(tick)}
cv.addEventListener('pointerdown',jump);
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}});
reset();tick();
</script>
</body>
</html>
