<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gioco del 15 · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>
#g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(90vw,380px)}
#g button{aspect-ratio:1;font-size:1.8rem;font-weight:700;padding:0}
#g button.e{visibility:hidden}
#g button.ok{color:var(--ok)}
</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Gioco del 15</h1><span></span></header>
<div class="bar"><span>Mosse: <b id="mv">0</b></span><span>Record: <b id="best">–</b></span></div>
<p class="status" id="st">Tocca una tessera vicina allo spazio vuoto</p>
<div id="g"></div>
<p><button id="new">Mescola</button></p>
<script>
const $=id=>document.getElementById(id),N=4;
let t,moves,done,best=0;
try{best=+localStorage.getItem('quindici')||0}catch{}
const cells=[...Array(N*N)].map((_,i)=>{const b=document.createElement('button');b.onclick=()=>move(i);$('g').append(b);return b});
const adj=(a,b)=>Math.abs((a/N|0)-(b/N|0))+Math.abs(a%N-b%N)===1;
function draw(){
  cells.forEach((b,i)=>{b.textContent=t[i]||'';b.className=!t[i]?'e':t[i]===i+1?'ok':'';b.setAttribute('aria-label',t[i]?'tessera '+t[i]:'vuoto')});
  $('mv').textContent=moves;$('best').textContent=best||'–'}
function move(i){
  const e=t.indexOf(0);if(done||!adj(i,e))return;[t[i],t[e]]=[t[e],t[i]];moves++;
  if(t.every((v,k)=>v===(k+1)%(N*N))){done=true;$('st').textContent=`Risolto in ${moves} mosse! 🎉`;
    if(!best||moves<best){best=moves;try{localStorage.setItem('quindici',best)}catch{}}}
  draw()}
function shuffle(){
  // mescola con mosse valide: così il puzzle è sempre risolvibile
  t=[...Array(N*N-1).keys()].map(k=>k+1).concat(0);let prev=-1;
  for(let k=0;k<300;k++){const e=t.indexOf(0),opts=[...Array(N*N).keys()].filter(j=>adj(j,e)&&j!==prev);const j=opts[Math.random()*opts.length|0];[t[j],t[e]]=[t[e],t[j]];prev=e}
  moves=0;done=false;$('st').textContent='Tocca una tessera vicina allo spazio vuoto';draw()}
document.addEventListener('keydown',e=>{
  const z=t.indexOf(0),r=z/N|0,c=z%N;
  // la freccia sposta la tessera verso lo spazio vuoto
  const m={ArrowUp:r<N-1?z+N:-1,ArrowDown:r>0?z-N:-1,ArrowLeft:c<N-1?z+1:-1,ArrowRight:c>0?z-1:-1}[e.key];
  if(m!==undefined){e.preventDefault();if(m>=0)move(m)}});
$('new').onclick=shuffle;shuffle();
</script>
</body>
</html>
