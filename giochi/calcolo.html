<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calcolo veloce · Ascanio's Games</title>
<link rel="stylesheet" href="../style.css">
<style>
#q{font-size:2.6rem;font-weight:700;margin:8px 0}
#a{font-size:2rem;min-height:2.6rem;min-width:140px;text-align:center;border-bottom:3px solid var(--accent)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,300px);margin-top:16px}
#pad button{padding:14px 0;font-size:1.4rem}
</style>
</head>
<body>
<header><a href="../index.html">← Giochi</a><h1>Calcolo veloce</h1><span></span></header>
<div class="bar"><span>Giuste: <b id="pts">0</b></span><span>Tempo: <b id="time">60</b></span><span>Record: <b id="best">0</b></span></div>
<p id="q">Pronto?</p>
<div id="a" aria-live="polite"></div>
<div id="pad"></div>
<p class="status" id="st"></p>
<button id="go">Inizia</button>
<script>
const $=id=>document.getElementById(id),R=n=>1+Math.random()*n|0;
let ans,typed='',pts=0,left,timer,running=false,best=0;
try{best=+localStorage.getItem('calcolo')||0}catch{}
$('best').textContent=best;
['1','2','3','4','5','6','7','8','9','⌫','0','−'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>key(k);$('pad').append(b)});
function ask(){
  const op='+−×'[Math.random()*3|0],lim=10+pts*2;let a=R(lim),b=R(lim);
  if(op==='×'){a=R(10);b=R(10)}
  ans=op==='+'?a+b:op==='−'?a-b:a*b;$('q').textContent=`${a} ${op} ${b}`;typed='';$('a').textContent=''}
function key(k){
  if(!running)return;
  if(k==='⌫')typed=typed.slice(0,-1);
  else if(k==='−'){if(!typed)typed='-'}
  else if(typed.length<5)typed+=k;
  $('a').textContent=typed;
  if(+typed===ans&&typed!=='-'){$('pts').textContent=++pts;ask()}}
function end(){
  running=false;clearInterval(timer);$('go').disabled=false;$('q').textContent='Tempo!';
  if(pts>best){best=pts;try{localStorage.setItem('calcolo',best)}catch{}$('best').textContent=best;$('st').textContent=`Nuovo record: ${pts}!`}
  else $('st').textContent=`${pts} risposte giuste`}
$('go').onclick=()=>{pts=0;left=60;running=true;$('pts').textContent=0;$('time').textContent=60;$('st').textContent='';$('go').disabled=true;ask();
  timer=setInterval(()=>{$('time').textContent=--left;if(!left)end()},1000)};
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='-')key('−')});
</script>
</body>
</html>
